spring.application.name=cp_room_booking

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.web.pageable.max-page-size=100

app.jwt.secret=test-secret-key-for-unit-tests-only-32-chars-min
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:3000
app.zone-id=Asia/Bangkok

app.booking.building-open=08:00
app.booking.building-close=22:00

app.scheduler.enabled=false
app.scheduler.fixed-delay-ms=60000
