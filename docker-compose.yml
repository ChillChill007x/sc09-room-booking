# รันทั้งระบบด้วยคำสั่งเดียว: docker compose up --build
# frontend http://localhost:3000  backend http://localhost:8080  Swagger http://localhost:8080/swagger-ui.html

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cp_room_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cp_room_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./code/backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cp_room_booking
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-docker-compose-local-secret-key-change-me-32chars}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./code/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
